name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Each job asks for exactly what it needs; the job that runs the tests never holds a write token.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to the SHA that triggered the run, because a tag is mutable and checkout resolves a
      # tag ref at fetch time. persist-credentials: false, since nothing here pushes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: The tag names the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # moves the major tag and creates the release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Users write pbiplint/action@v1 and get the newest v1.x.y: the major tag follows every
      # release. Marketplace listing is a checkbox on the release page, done by hand.
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "$major"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
