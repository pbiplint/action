name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The action run on itself against the messy-sales example project, its model and its report,
  # from the main repository, pinned to a commit so the sample under these checks cannot change
  # under us. Once asking for a CLI version npm does not have, which must fail with exit code 2;
  # once reporting without failing, which must pass and must reach code scanning; and once with
  # the default gate, which must fail with exit code 1. Windows too, since Power BI shops run
  # Windows runners.
  dogfood:
    name: dogfood (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Check out the sample project
        uses: actions/checkout@v7
        with:
          repository: pbiplint/pbiplint
          ref: 1fbf8cde0decf16885808120adc8eccd9bd53a87
          path: sample
          sparse-checkout: examples/messy-sales
          persist-credentials: false
      # First, since every run of the action replaces the one SARIF file in RUNNER_TEMP, and this
      # one leaves none.
      - name: Ask for a version that does not exist
        id: missing
        uses: ./
        continue-on-error: true
        with:
          path: sample/examples/messy-sales
          pbiplint-version: 0.0.0-not-published
          upload-sarif: false
      # The reason a run that produced no report gives is kept for the job summary, which a later
      # step cannot read, so the file it is written from is checked straight after.
      - name: Point at a path that does not exist
        id: nowhere
        uses: ./
        continue-on-error: true
        with:
          path: sample/examples/not-there
          upload-sarif: false
      - name: Check the reason was kept for the summary
        shell: bash
        env:
          NOWHERE_EXIT: ${{ steps.nowhere.outputs.exit-code }}
        run: |
          cat "$RUNNER_TEMP/pbiplint.err"
          test "$NOWHERE_EXIT" = "2"
          grep -q "sample/examples/not-there does not exist" "$RUNNER_TEMP/pbiplint.err"
      - name: Report without failing
        id: report
        uses: ./
        with:
          path: sample/examples/messy-sales
          fail-on: none
          sarif-category: pbiplint/${{ matrix.os }}
      - name: Gate on findings
        id: gate
        uses: ./
        continue-on-error: true
        with:
          path: sample/examples/messy-sales
          upload-sarif: false
      - name: Check the three outcomes
        shell: bash
        env:
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          MISSING_EXIT: ${{ steps.missing.outputs.exit-code }}
          REPORT_EXIT: ${{ steps.report.outputs.exit-code }}
          REPORT_SARIF: ${{ steps.report.outputs.sarif-file }}
          FINDINGS: ${{ steps.report.outputs.findings }}
          ERRORS: ${{ steps.report.outputs.errors }}
          WARNINGS: ${{ steps.report.outputs.warnings }}
          INFOS: ${{ steps.report.outputs.infos }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_EXIT: ${{ steps.gate.outputs.exit-code }}
        run: |
          echo "missing version: $MISSING_OUTCOME, exit $MISSING_EXIT"
          echo "report: exit $REPORT_EXIT, $FINDINGS findings ($ERRORS errors, $WARNINGS warnings, $INFOS info), $REPORT_SARIF"
          echo "gate: $GATE_OUTCOME, exit $GATE_EXIT"
          test "$REPORT_EXIT" = "0"
          test -s "$REPORT_SARIF"
          test "$ERRORS" -gt 0
          test "$FINDINGS" -eq $((ERRORS + WARNINGS + INFOS))
          test "$GATE_OUTCOME" = "failure"
          test "$GATE_EXIT" = "1"
          test "$MISSING_OUTCOME" = "failure"
          test "$MISSING_EXIT" = "2"
